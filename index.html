function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/'/g,' ').replace(/\s+/g,' ').trim()}

SC.nino={img:'nino',text:()=>"Le 23. 132a e Park. La sopraelevata passa a tre metri dalle finestre della drogheria di Nino; accanto, il rombo di una lavanderia. Auto scure, uomini col cappello. In fondo all'isolato, dove il treno piega verso il fiume, si alza la TORRE di ferro del ponte, nera contro la luna quasi piena."+(S.cl.includes('alto')||S.cl.includes('trappola')||S.cl.includes('bruciatura')?"\nLei uccide dall'alto. Sempre.":"")+"\nPuoi salire sulla TORRE, ENTRARE nella drogheria o ASPETTARE in strada.",

function monologue(){out("'Madden mi ha portato via mio marito. Coll era la mia chiave, ma il potere glielo davo io: la pietra di mio padre, e ciò che richiama. Non voglio solo Madden morto. Voglio che gli italiani distruggano tutto quello che ama.'\nDalla tasca: una pietra piatta con l'impronta di due artigli, e una scatola di fiammiferi. Dentro la scatola, un sigillo.")}
function fight(){const r=roll('COMBATTIMENTO',S.f.cbonus||0,5,5);qimg('lottie_conf');
 if(r==='S'){out("Le blocchi il polso contro la ringhiera. La pietra, la scatola, e il braccialetto che le strappi: ora sono nelle tue mani. Il ferro vibra. Sotto di te, il fiume nero.\nUn impulso ti dice di GETTARE tutto nel fiume. Oppure potresti TENERLI: la prova di tutto.");S.scene='presa';save()}
 else{out("Lottie è più forte di quanto sembri. Ti respinge e la pietra tocca il sigillo.");go('segugio')}}
SC.presa={img:'lottie_conf',text:()=>"Hai la pietra, la scatola e il braccialetto. Lottie ti fissa, ansimando. GETTA o TIENI?",
 acts:()=>[A('gett|butt|fium|lanc|via|sbarazz','GETTA',()=>{S.headline=HL.mad;ending(1,'fiume',"La pietra cade nel fiume senza un suono. La scatola la segue. Il braccialetto si spezza sull'acqua nera in cento piccole lune. Lottie urla come se le avessi strappato il cuore.\nAll'alba la consegni a O'Connor. Nessuno crederà mai al Segugio, ma quattro omicidi bastano.\n"+(S.goal==='ragazze'?"Il tuo articolo, 'Ho lavorato in un night club', esce senza fare nomi. Le ragazze del Fantasia lo leggono in camerino, ad alta voce.":"Il tuo articolo sul Fantasia e i soldi di Lucky fa tremare mezzo Municipio.")+"\nSettimane dopo: Owney Madden lascia New York per Hot Springs. Su Harlem, la nebbia si alza.")}),
  A('tien|conserv|prova|tasca|portal','TIENI',()=>{qimg('segugio');out("Il ferro gela sotto le tue dita. Dall'angolo acuto di una trave cola una nebbia blu: il Segugio arriva comunque. Fiuta l'aria, e trova l'odore che conosce da anni. Lottie, senza specchi, non ha più dove nascondersi.\nNon guardi. Quando il silenzio torna, la bestia si gira verso la pietra nella tua mano.");S.scene='ultima';out('GETTALA, presto!','roll')})]};
SC.ultima={img:'segugio',text:()=>"La lingua cava frusta l'aria verso la tua mano.",acts:()=>[A('gett|butt|lasc|lanc|fium|mollal','GETTALA',()=>{S.headline=HL.mad;ending(2,'giornale',"Lanci la pietra lontano. La bestia la segue attraverso un angolo che non esiste e scompare. Restano solo la nebbia e una scatola di fiammiferi bruciata.\nNessun giornale pubblicherà la verità. Scrivi un'altra storia, e la verità te la tieni stretta come un dente rotto.\nSettimane dopo, Madden se ne va a Hot Springs. Tu, a volte, eviti gli angoli.")}),
 A('fugg|scapp|corr|tien','FUGGI',()=>ending(4,'decap',"Corri, con la pietra stretta nel pugno. Il Segugio non ha bisogno di correre: è già nell'angolo davanti a te.\nUna lingua fredda e acida ti si stringe attorno al collo. L'ultimo pensiero è per la storia che non scriverai."))]};

  out("Il Segugio punta Lottie. Lei alza il polso e fa ruotare il braccialetto: mille schegge di luce. La bestia si ferma... e si volta verso di te.\nPuoi FUGGIRE o colpire il BRACCIALETTO.")},
 acts:()=>[A('fugg|scapp|corr','FUGGI',()=>{const r=roll('FUGA',0,5,3);if(r==='S'){out("Corri, dritta contro Lottie. L'impatto vi manda entrambe contro la ringhiera.");set('fb',2);youOrLottie()}else if(r==='T'){out("Provi a mettere Lottie tra te e il mostro, ma la bestia non si ferma per lei. Devi voltarti e affrontarla.");youOrLottie()}
   else ending(4,'decap',"Lottie salta giù dalla passerella sui binari e fugge. L'ultima cosa che vedi è il bagliore del braccialetto.\nPoi una lingua fredda e acida ti si stringe attorno al collo. All'alba, gli operai della ferrovia troveranno quello che resta di Vivian Sinclair.")}),

function youOrLottie(){let m=(S.f.fb||0)+(S.cl.includes('segugio')?2:0);const r=roll('COMBATTIMENTO',m,6,3);
 if(r==='S'){S.headline=HL.mad;ending(2,'giornale',"Le afferri il polso e lo sbatti contro il ferro. Il braccialetto si spezza. Il Segugio sente l'odore di chi lo ha schernito per anni, e non sbaglia più bersaglio.\nNon guardi. Quando ti volti, sulla passerella restano una pietra in frantumi e una scatola di fiammiferi bruciata.\nNessun giornale pubblicherebbe la verità. Settimane dopo: Madden lascia il Cotton Club per Hot Springs. Tu impari a guardare gli angoli delle stanze.")}
 else if(r==='T'){qimg('decap');out("Ti ritrovi a terra, inchiodata sotto Lottie. Non riesci a rompere il braccialetto. Ma il Segugio ha altri sensi: conosce il suo odore, quello di chi tiene la pietra. La bava ti cola sul viso mentre la bestia prende lei, sopra di te.");
  const r2=roll('EQUILIBRIO',0,4,4);if(r2!=='P'){S.headline=HL.mad;ending(3,'torre',"Il Segugio scompare in un angolo della trave. Resti sulla passerella fino all'alba, a respirare.\nPer giorni non dormi. Poi, un mattino, cataloghi la cosa tra gli orrori che hai visto, e ricominci a scrivere. Nessuno richiamerà più quella bestia. Devi crederlo.")}else madness()}
 else ending(4,'decap',"Lottie ti lascia, ferita, sulla traiettoria del Segugio. La lingua scende, e comincia ad avvolgerti.\nIl tuo ultimo pensiero è per la storia che nessuno scriverà. All'alba, gli operai della ferrovia fanno una scoperta orribile. Madden non muore, quella notte. Ma lascia New York lo stesso.")}
function madness(){ending(8,'frantumi',"La tua mente si spezza in piccoli frammenti, come il braccialetto di Lottie. Per rimetterli insieme ci vorrà tempo, e non sarai più la stessa.\nTi risvegli in una stanza bianca. Louisa, la tua amica infermiera, ti tiene la mano. Fuori, la nebbia. Dentro, gli angoli. Troppi angoli.")}
SC.ospite={img:'drogheria',text:()=>"Il secondo piano della drogheria di Nino. Il treno sfreccia a tre metri dalle finestre e fa tremare i bicchieri. Sal ti fa sedere in un angolo: 'Prima chiariamo col signor Madden. Poi vediamo che fare di te.'\nMadden arriva rosso in viso, disarmato. Niente Frenchy.",
 acts:()=>[A('aspett|osserv|guard|ascolt|zitt|nulla|niente','ASPETTA',()=>attack()),A('parl|sal|madden|spieg','PARLA',()=>{out("Apri bocca, ma in quel momento...");attack()}),A('fugg|scapp','FUGGI',()=>{out("Un uomo di Sal ti rimette a sedere con una mano sola. E in quel momento...");attack()})]};
function attack(){qimg('segugio');out("Spari in strada. Qualcuno spegne la luce, gli uomini aprono le tende. Dall'angolo della drogheria esce una cosa magra e angolosa che avvolge la lingua attorno a uno degli uomini di Sal. I proiettili non le fanno niente.");
 const r=roll('EQUILIBRIO',0,6,3);if(r==='S'){out("Ti concentri sull'umanità dietro il mostro. Tutto si riduce alla vendetta di una donna.");vant('TUTTO TROPPO UMANO')}else if(r==='T')out("Il sangue ti si gela. Stringi i denti.");else{trauma('DA UN ALTRA DIMENSIONE');if(S.trauma>=3){madness();return}}
 qimg('drogheria');out("Dieci secondi, poi la cosa svanisce in un angolo. Due uomini trascinano dentro una donna che si dibatte: Lottie Coll. 'La cosa non l'abbiamo presa. Lei sì.' Lottie infila le mani in tasca.\nPuoi DISARMARLA o LASCIARE fare agli uomini.");S.scene='ospite2';save()}
SC.ospite2={img:'drogheria',text:()=>"Lottie ha le mani in tasca. DISARMALA o LASCIA fare?",
 acts:()=>[A('disarm|afferr|blocc|strapp|salt|ferm|attacc|mani','DISARMALA',()=>{const r=roll('COMBATTIMENTO',0,5,3);
   if(r==='S'){out("Le immobilizzi i polsi: una pietra con l'impronta di due artigli, una scatola di fiammiferi coperta di sigilli. E il braccialetto, che le sfili.");set('pbonus',3);persuade()}
   else if(r==='T'){out("Non riesci a strapparle niente, ma la distrai abbastanza: uno degli uomini di Sal le prende tutto.");persuade()}

  A('lasc|aspett|niente|uomin|guard','LASCIA',()=>{out("Gli uomini di Sal la bloccano e le svuotano le tasche: una pietra, una scatola di fiammiferi.");persuade()})]};

SC.persuadi={img:'drogheria',text:()=>"Sal soppesa la pietra. CONVINCILO.",acts:()=>[A('convin|parl|fium|gett|ferm|spieg|rassic|prego|non','CONVINCI',()=>{const r=roll('AUTOCONTROLLO',S.f.pbonus||0,6,3);
 if(r!=='P'){if(r==='S')vant('UNA DONNA PERSUASIVA');S.headline=HL.mad;ending(5,'sanatorio',"Gli racconti di Tony, di Jimmy, di Ricky. Di cosa arriva dagli angoli. Sal guarda Madden, Madden guarda Sal. La pietra finisce nell'East River.\nNessuno vuole essere l'uomo che uccide una donna. Proponi un sanatorio: conosci un'infermiera, Louisa. Lottie viene portata via all'alba, il polso nudo, lo sguardo perso negli angoli.\nTi mostrano la porta: 'Pensaci bene, prima di scrivere.' Settimane dopo, Madden lascia New York per sempre.")}
 else{out("Sal ride delle tue paure e accosta la pietra al sigillo.");qimg('segugio');out("La nebbia cola dall'angolo del soffitto. La bestia non cerca Lottie: il braccialetto la protegge. Cerca chi tiene la pietra. Sal non ha il tempo di urlare.");escape()}})]};
function escape(){const r=roll('FUGA',0,4,4);if(r!=='P'){S.headline=HL.dead;ending(6,'fuga',"Ti butti giù per le scale mentre alle tue spalle esplode l'inferno: spari, urla, il treno che passa. Corri sotto la sopraelevata finché non hai più fiato.\nAl mattino i giornali parlano di una sparatoria tra bande. Sal Rossi è morto. Lottie Coll è sparita nella città. Madden lascia New York. E tu sai che, da qualche parte, qualcuno ha ancora una scatola di fiammiferi.")}
 else ending(4,'decap',"Inciampi sul primo gradino. La nebbia è già lì, in ogni angolo della tromba delle scale.\nUna lingua fredda e acida ti si stringe attorno al collo. L'ultimo pensiero è per la storia che non scriverai.")}

// ================= SAVE / TITLE =================
function save(){try{if(S&&S.scene&&S.scene[0]!=='_')localStorage.setItem('nebbia_save',JSON.stringify(S))}catch(e){}}
function clearSave(){try{localStorage.removeItem('nebbia_save')}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('nebbia_save');return s?JSON.parse(s):null}catch(e){return null}}
function toTitle(){mode='title';queue=[];page=null;waitKey=false;promptOn=false;curImg='title';imgT0=performance.now();input='';inp.value=''}
function newGame(){S=newState();mode='play';queue=[];page=null;waitKey=false;fails=0;
 out("Scrivi cosa vuoi fare e premi INVIO: bastano parole semplici, come BALLA o PARLA CON NORA. Scrivi AIUTO se sei bloccata, TACCUINO per i tuoi indizi.",'dim');qimg('strada');go('i1');pump()}
function contGame(s){S=s;mode='play';queue=[];page=null;waitKey=false;fails=0;out('Bentornata, Viv.','dim');go(S.scene);pump()}

// ================= AUDIO =================
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=6;const g=AC.createGain();g.gain.value=.035;
 const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);
 const lfo2=AC.createOscillator();lfo2.frequency.value=.13;const lg2=AC.createGain();lg2.gain.value=.025;lfo2.connect(lg2);lg2.connect(g.gain);
 n.connect(bp);bp.connect(g);g.connect(master);n.start();lfo.start();lfo2.start();
 const o=AC.createOscillator();o.type='sine';o.frequency.value=55;const og=AC.createGain();og.gain.value=.03;o.connect(og);og.connect(master);o.start()}catch(e){AC=null}}
function tone(f,d,type='square',v=.05,f2){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function nburst(d,v=.08,f=2000){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.02)}
function sfx(k){if(!AC)return;if(k==='tick')tone(1800+Math.random()*300,.012,'square',.012);else if(k==='key')nburst(.03,.05,3000);else if(k==='enter')tone(660,.06,'square',.03);
 else if(k==='static')nburst(.25,.06,800);else if(k==='dice'){for(let i=0;i<6;i++)setTimeout(()=>nburst(.04,.07,1500),i*110)}else if(k==='ding'){tone(880,.12,'square',.03);setTimeout(()=>tone(1320,.18,'square',.025),90)}
 else if(k==='bad')tone(220,.35,'sawtooth',.04,110);else if(k==='end'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square',.03),i*140))}
 else if(k==='howl'){tone(320,1.6,'sawtooth',.035,90)}}

// ================= RENDER =================
function renderImage(t){const im=IMG[curImg]||IMG.title;L.fill(0);im.d(t);
 if(!im.nodark)for(let y=60;y<H;y++){const f=Math.max(.06,1-(y-60)/12);for(let x=0;x<W;x++)L[y*W+x]*=f}
 const st=Math.max(0,1-(performance.now()-imgT0)/350);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=L[y*W+x];if(st>0)v=v*(1-st)+Math.random()*st*.8;v=v>0?Math.min(.999,Math.pow(v,.78)*1.12)*6:0;const b=v|0,fr=v-b;const ci=Math.min(6,b+(fr>BAYER[(y&3)*4+(x&3)]?1:0));const c=PAL[ci];
  const i=(y*2)*SW+x*2;BUF[i]=c;BUF[i+1]=c;BUF[i+SW]=c;BUF[i+SW+1]=c}
 if(im.ov)for(const o of im.ov())dstr(o.x,o.y,san(o.s),o.c,o.j)}
function colFor(st){return st==='dim'?C_DIM:st==='roll'?C_ROLL:st==='hint'?C_HI:C_TXT}
function renderText(now){tapZones=[];const blink=(now/400|0)%2;
 if(mode==='title'){const f=found().length;const sv=loadSave();
  if(sv){const s1='C = CONTINUA     N = NUOVA PARTITA';dstr((SW-s1.length*6)/2|0,176,s1,blink?C_TXT:C_DIM);tapZones.push({x:30,y:170,w:90,h:18,cmd:'c'},{x:130,y:170,w:110,h:18,cmd:'n'})}
  else{const s1='PREMI UN TASTO PER INIZIARE';if(blink)dstr((SW-s1.length*6)/2|0,176,s1,C_TXT)}
  const s2=`FINALI SCOPERTI: ${f}/8`;dstr((SW-s2.length*6)/2|0,194,s2,C_DIM);return}
 const y0=SH-74;if(page){let left=Math.floor(page.shown);for(let i=0;i<page.lines.length;i++){const l=page.lines[i];const n=Math.max(0,Math.min(l.s.length,left));left-=l.s.length;const s=l.s.slice(0,n);
  dstr(6,y0+i*10,s,colFor(l.st));if(l.st==='hint'&&n===l.s.length){const m=l.s.match(/^(Puoi: )?(.*)$/);let off=(m[1]||'').length;const parts=m[2].split(', ');for(const p of parts){const w=p.replace(/\*$/,'');tapZones.push({x:6+off*6-2,y:y0+i*10-2,w:p.length*6+4,h:12,cmd:w});off+=p.length+2}}}}
 if(waitKey&&blink)dstr(SW-24,SH-14,'...',C_TXT);
 if(promptOn&&(mode==='play'||mode==='yn')){const vis=input.length>38?input.slice(-38):input;dstr(6,SH-14,'>'+san(vis),C_TXT);if(blink)dstr(12+vis.length*6,SH-14,'█',C_TXT)}}
function renderDie(now){if(!die)return;const el=now-die.t0,dur=900;const v=el<dur?1+((now/70|0)%6):die.d;const x=SW-34,y=8;
 for(let j=0;j<26;j++)for(let i=0;i<26;i++){const e=i===0||j===0||i===25||j===25;BUF[(y+j)*SW+x+i]=e?C_HI:PAL[1]}
 const P={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]}[v];
 for(const[a,b]of P){const cx=x+6+a*7,cy=y+6+b*7;for(let j=0;j<4;j++)for(let i=0;i<4;i++)BUF[(cy+j)*SW+cx+i]=C_HI}
 if(el>dur+700){die=null;pump()}}
let nf=0;function renderNoise(){nf++;if(nf%2)return;const id=nctx.createImageData(132,108),d=id.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=v*.6;d[i+1]=v;d[i+2]=v*.9;d[i+3]=255}nctx.putImageData(id,0,0)}
function frame_(now){const t=now/1000;const dt=Math.min(.1,(now-(lastT||now))/1000);lastT=now;
 if(page&&page.shown<page.chars){const before=page.shown|0;page.shown=Math.min(page.chars,page.shown+dt*95);if((page.shown|0)>before&&((page.shown|0)%3===0))sfx('tick');if(page.shown>=page.chars)pump()}
 if(!die&&!waitKey&&(!page||page.shown>=page.chars)&&queue.length)pump();
 renderImage(t);renderText(now);renderDie(now);sctx.putImageData(IMGD,0,0);gctx.clearRect(0,0,SW,SH);gctx.drawImage(scr,0,0);renderNoise();
 if(curImg==='segugio'&&!frame_.h){frame_.h=1;sfx('howl')}if(curImg!=='segugio')frame_.h=0;
 requestAnimationFrame(frame_)}
requestAnimationFrame(frame_);

// ================= INPUT =================
const isTouch=matchMedia('(pointer:coarse)').matches;
function anyKey(){initAudio();if(mode==='boot'){toTitle();return true}
 if(mode==='title'){const sv=loadSave();if(sv){return false}newGame();return true}
 if(advance())return true;return false}
function handleChar(cmd){ // for title choices & yn
 if(mode==='title'){const sv=loadSave();const c=norm(cmd);if(sv){if(c.startsWith('c'))contGame(sv);else if(c.startsWith('n')){clearSave();newGame()}}else newGame();return}
 if(mode==='yn'){const c=norm(cmd);if(c.startsWith('s')||c.startsWith('y')){mode='play';newGame()}else if(c.startsWith('n')){toTitle()}return}
 submit(cmd)}
inp.addEventListener('input',()=>{initAudio();if(mode==='title'){const v=inp.value;inp.value='';if(loadSave())handleChar(v);else anyKey();return}
 if(!promptOn){inp.value='';advance();return}input=inp.value;sfx('key')});
inp.addEventListener('keydown',e=>{initAudio();if(e.key==='Enter'){e.preventDefault();if(mode==='title'){if(!loadSave())anyKey();return}if(!promptOn){advance();return}const v=input;input='';inp.value='';handleChar(v)}});
addEventListener('keydown',e=>{if(document.activeElement!==inp){initAudio();if(e.key.length===1||e.key==='Enter'){inp.focus();if(mode==='boot'||(mode==='title'&&!loadSave())){anyKey();e.preventDefault();return}
 if(!promptOn&&mode!=='title'){advance();e.preventDefault();return}}}});
crt.addEventListener('pointerup',e=>{initAudio();const r=crt.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*SW,y=(e.clientY-r.top)/r.height*SH;
 for(const z of tapZones){if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){if(mode==='title'){handleChar(z.cmd);return}if(promptOn){input='';inp.value='';handleChar(z.cmd);return}}}
 if(mode==='boot'||(mode==='title'&&!loadSave())){anyKey();inp.focus();return}if(!promptOn&&advance())return;inp.focus()});
mode='boot';curImg='title';
(function bootMsg(){mode='title'})();
